<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImunoWay — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#C4522A;--navy:#1a1a2e;--bg:#f5f5f7;
  --text:#1a1a1a;--muted:#888;--border:#e5e5e7;--surface:#fff;
  --green:#0F766E;--red:#A32D2D;--radius:12px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
header{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#1a1a2e}
.logo span{color:var(--brand)}
.header-right{display:flex;align-items:center;gap:12px}
.admin-badge{background:#1a1a2e;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.btn-logout{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--muted)}
.btn-logout:hover{border-color:#ccc;color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:28px 24px}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid var(--border)}
.stat-n{font-size:28px;font-weight:700;color:var(--text)}
.stat-l{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat-card.green .stat-n{color:var(--green)}
.stat-card.red .stat-n{color:var(--red)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:700}
.btn{padding:9px 18px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--brand);color:#fff}
.btn-secondary{background:#f5f5f7;color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:5px 12px;font-size:11.5px;border-radius:7px}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.table-card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);background:#fafafa}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#E1F5EE;color:var(--green)}
.badge-red{background:#FCEBEB;color:var(--red)}
.badge-gray{background:#f5f5f5;color:#666}
.color-dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.1)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:28px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:#f5f5f5;border:none;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#333}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-preview{width:100%;height:36px;border-radius:8px;margin-top:6px;transition:background .2s}
.error-msg{background:#FCEBEB;border-radius:8px;padding:8px 12px;font-size:12px;color:#A32D2D;margin-bottom:12px;display:none}
.success-msg{background:#E1F5EE;border-radius:8px;padding:8px 12px;font-size:12px;color:var(--green);margin-bottom:12px;display:none}
.paletas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.paleta-opt{width:28px;height:28px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.paleta-opt:hover,.paleta-opt.selected{border-color:#333}
</style>
</head>
<body>

<header>
  <div class="logo">Imuno<span>.</span>Way</div>
  <div class="header-right">
    <span class="admin-badge">ADMIN</span>
    <span id="admin-name" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <div class="page-title">Painel Administrativo</div>
  <div class="page-sub">Gerencie todos os médicos clientes do ImunoWay</div>

  <div class="stats-row">
    <div class="stat-card green">
      <div class="stat-n" id="stat-total">—</div>
      <div class="stat-l">Total de clientes</div>
    </div>
    <div class="stat-card">
      <div class="stat-n" id="stat-ativos" style="color:var(--green)">—</div>
      <div class="stat-l">Clientes ativos</div>
    </div>
    <div class="stat-card">
      <div class="stat-n" id="stat-inativos" style="color:var(--red)">—</div>
      <div class="stat-l">Clientes inativos</div>
    </div>
    <div class="stat-card">
      <div class="stat-n" id="stat-pacientes">—</div>
      <div class="stat-l">Total de pacientes</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">Clientes cadastrados</div>
    <button class="btn btn-primary" onclick="openNewModal()">+ Novo cliente</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Médico</th>
          <th>Especialidade</th>
          <th>Email</th>
          <th>Cor</th>
          <th>Status</th>
          <th>Pacientes</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="medicos-tbody">
        <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Modal Novo/Editar Cliente -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Novo cliente</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="error-msg" id="modal-error"></div>
    <div class="success-msg" id="modal-success"></div>

    <div class="field">
      <label>Nome completo *</label>
      <input type="text" id="f-nome" placeholder="Dra. Maria Silva">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Especialidade *</label>
        <input type="text" id="f-spec" placeholder="Imunologia e Alergia">
      </div>
      <div class="field">
        <label>PIN / Senha de acesso *</label>
        <input type="text" id="f-pin" placeholder="ex: 38701">
      </div>
    </div>
    <div class="field">
      <label>Email de acesso *</label>
      <input type="email" id="f-email" placeholder="medico@clinica.com.br">
    </div>

    <div class="field">
      <label>Paleta de cores</label>
      <div class="paletas" id="paletas-grid"></div>
    </div>

    <div class="field-row" style="margin-top:12px">
      <div class="field">
        <label>Cor principal (brand)</label>
        <input type="color" id="f-brand" value="#C4522A" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Cor do sidebar (navy)</label>
        <input type="color" id="f-navy" value="#2C1810" oninput="updatePreview()">
      </div>
    </div>
    <div class="color-preview" id="color-preview"></div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-primary" style="flex:1" onclick="saveCliente()">Salvar</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://nekqsuvjzwzprcsozwnr.supabase.co';
const SUPA_KEY = 'sb_publishable_cItO3Ib9OUn1SibZYsykgA_4RiXOLB8';

// Check admin session
var session;
try { session = JSON.parse(localStorage.getItem('iw_session')); } catch(e){}
if(!session || !session.is_admin || session.expires < Date.now()){
  window.location.href = 'index.html';
}
document.getElementById('admin-name').textContent = session.nome;

function logout(){ localStorage.removeItem('iw_session'); window.location.href='index.html'; }

// Paletas predefinidas
var PALETAS = [
  {brand:'#C4522A',navy:'#2C1810',label:'Terracota'},
  {brand:'#0F766E',navy:'#134E4A',label:'Verde-água'},
  {brand:'#0066CC',navy:'#0C2A4A',label:'Azul'},
  {brand:'#7B2D8B',navy:'#2D1040',label:'Roxo'},
  {brand:'#1D6F42',navy:'#0A2E1A',label:'Verde'},
  {brand:'#B45309',navy:'#3D1F08',label:'Âmbar'},
  {brand:'#0E7490',navy:'#0C3547',label:'Ciano'},
  {brand:'#BE185D',navy:'#3D0927',label:'Rosa'},
];

var _editingId = null;
var medicosData = [];

// Load medicos on start
loadMedicos();

async function loadMedicos(){
  try{
    var res = await fetch(SUPA_URL+'/rest/v1/medicos?select=*,pacientes(count)&order=criado_em.desc', {
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    medicosData = await res.json();
    renderTable(medicosData);
    updateStats(medicosData);
  }catch(e){
    document.getElementById('medicos-tbody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;color:#A32D2D;padding:24px">Erro ao carregar: '+e.message+'</td></tr>';
  }
}

function updateStats(data){
  var ativos   = data.filter(function(m){ return m.ativo; }).length;
  var inativos = data.length - ativos;
  var totalPts = data.reduce(function(acc,m){ return acc+(m.pacientes?m.pacientes[0]?.count||0:0); },0);
  document.getElementById('stat-total').textContent    = data.length;
  document.getElementById('stat-ativos').textContent   = ativos;
  document.getElementById('stat-inativos').textContent = inativos;
  document.getElementById('stat-pacientes').textContent = totalPts;
}

function renderTable(data){
  var tb = document.getElementById('medicos-tbody');
  if(!data.length){
    tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">Nenhum cliente cadastrado ainda.</td></tr>';
    return;
  }
  tb.innerHTML = data.map(function(m){
    var pts = m.pacientes ? (m.pacientes[0]?.count||0) : '—';
    return '<tr>'+
      '<td><strong>'+m.nome+'</strong></td>'+
      '<td style="color:var(--muted);font-size:12px">'+m.especialidade+'</td>'+
      '<td style="font-size:12px">'+m.email+'</td>'+
      '<td><span class="color-dot" style="background:'+m.cor_brand+'"></span>'+m.cor_brand+'</td>'+
      '<td><span class="badge '+(m.ativo?'badge-green':'badge-red')+'">'+(m.ativo?'Ativo':'Inativo')+'</span></td>'+
      '<td style="font-weight:600">'+pts+'</td>'+
      '<td style="display:flex;gap:6px">'+
        '<button class="btn btn-sm btn-secondary" onclick="editCliente(\''+m.id+'\')">✏️ Editar</button>'+
        '<button class="btn btn-sm '+(m.ativo?'btn-red':'btn-green')+'" onclick="toggleAtivo(\''+m.id+'\','+m.ativo+')">'+(m.ativo?'Desativar':'Ativar')+'</button>'+
      '</td>'+
    '</tr>';
  }).join('');
}

function openNewModal(){
  _editingId = null;
  document.getElementById('modal-title').textContent = 'Novo cliente';
  document.getElementById('f-nome').value  = '';
  document.getElementById('f-spec').value  = '';
  document.getElementById('f-pin').value   = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-brand').value = '#C4522A';
  document.getElementById('f-navy').value  = '#2C1810';
  document.getElementById('modal-error').style.display   = 'none';
  document.getElementById('modal-success').style.display = 'none';
  buildPaletas();
  updatePreview();
  document.getElementById('modal-overlay').classList.add('open');
}

function editCliente(id){
  var m = medicosData.find(function(x){ return x.id===id; });
  if(!m) return;
  _editingId = id;
  document.getElementById('modal-title').textContent = 'Editar cliente';
  document.getElementById('f-nome').value  = m.nome||'';
  document.getElementById('f-spec').value  = m.especialidade||'';
  document.getElementById('f-pin').value   = m.pin||'';
  document.getElementById('f-email').value = m.email||'';
  document.getElementById('f-brand').value = m.cor_brand||'#C4522A';
  document.getElementById('f-navy').value  = m.cor_navy||'#2C1810';
  document.getElementById('modal-error').style.display   = 'none';
  document.getElementById('modal-success').style.display = 'none';
  buildPaletas();
  updatePreview();
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

function buildPaletas(){
  var brand = document.getElementById('f-brand').value;
  var html = PALETAS.map(function(p){
    var sel = p.brand===brand ? ' selected' : '';
    return '<div class="paleta-opt'+sel+'" style="background:'+p.brand+'" title="'+p.label+'" onclick="selectPaleta(\''+p.brand+'\',\''+p.navy+'\')"></div>';
  }).join('');
  document.getElementById('paletas-grid').innerHTML = html;
}

function selectPaleta(brand, navy){
  document.getElementById('f-brand').value = brand;
  document.getElementById('f-navy').value  = navy;
  updatePreview();
  buildPaletas();
}

function updatePreview(){
  var brand = document.getElementById('f-brand').value;
  var navy  = document.getElementById('f-navy').value;
  document.getElementById('color-preview').style.background =
    'linear-gradient(135deg,'+navy+' 0%,'+brand+' 100%)';
}
updatePreview();

async function saveCliente(){
  var nome  = document.getElementById('f-nome').value.trim();
  var spec  = document.getElementById('f-spec').value.trim();
  var pin   = document.getElementById('f-pin').value.trim();
  var email = document.getElementById('f-email').value.trim();
  var brand = document.getElementById('f-brand').value;
  var navy  = document.getElementById('f-navy').value;
  var errEl = document.getElementById('modal-error');
  var sucEl = document.getElementById('modal-success');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if(!nome||!spec||!pin||!email){ errEl.textContent='Preencha todos os campos obrigatórios.'; errEl.style.display='block'; return; }

  var body = {nome:nome,especialidade:spec,pin:pin,email:email,cor_brand:brand,cor_navy:navy,ativo:true};

  try{
    var res;
    if(_editingId){
      res = await fetch(SUPA_URL+'/rest/v1/medicos?id=eq.'+_editingId, {
        method:'PATCH',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(body)
      });
    } else {
      res = await fetch(SUPA_URL+'/rest/v1/medicos', {
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(body)
      });
    }
    if(!res.ok){ var err=await res.text(); throw new Error(err); }
    sucEl.textContent = _editingId ? 'Cliente atualizado!' : 'Cliente criado com sucesso! Ele já pode fazer login.';
    sucEl.style.display='block';
    setTimeout(function(){ closeModal(); loadMedicos(); }, 1500);
  }catch(e){
    errEl.textContent = 'Erro: '+e.message;
    errEl.style.display='block';
  }
}

async function toggleAtivo(id, ativo){
  if(!confirm(ativo?'Desativar este cliente?':'Ativar este cliente?')) return;
  await fetch(SUPA_URL+'/rest/v1/medicos?id=eq.'+id, {
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({ativo:!ativo})
  });
  loadMedicos();
}
</script>
</body>
</html>
